<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7c843" />
    <title>Ahhway is offline</title>
    <style>
      :root {
        color: #17262b;
        background: #eef3f5;
        font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: "Iowan Old Style", Georgia, serif;
        font-size: 32px;
        font-weight: 500;
      }
      p {
        margin: 0 0 24px;
        color: #586970;
        line-height: 1.55;
      }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 23px;
        background: #17262b;
        color: #fff;
        padding: 0 22px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/ahhway-mark.png" alt="" />
      <h1>You are between signals.</h1>
      <p>Ahhway needs a connection to compare current weather and walking routes.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
